# Scans, GS
scan_family_base: TBD/scannet_default_fix_xyz_gs_preprocessed_no_feat

# Annotations
ll3da_base: /GaussianVLM_training_data/LL3DA_annotations
leo_base: /GaussianVLM_training_data


max_obj_len: ${dataset_wrapper_args.max_obj_len}
num_points: 4096
img_size: [224, 224]



gs_nr3d:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.ll3da_base}/Nr3D
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}

gs_scene_cap_3dllm:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.ll3da_base}/3D_LLM
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}

gs_qa_3dllm:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.ll3da_base}/3D_LLM
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}

gs_plan_3dllm:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.ll3da_base}/3D_LLM
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}

gs_dialog_3dllm:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.ll3da_base}/3D_LLM
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}

gs_scan2cap:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.leo_base}/Scan2Cap
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}
  pc_type: gt   # overrided from CLI
  iou_thres: 0.5
  corpus: ${data.leo_base}/Scan2Cap/scanrefer_corpus.json

gs_scanqa:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.leo_base}/ScanQA_Leo
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}
  pc_type: gt   # overrided from CLI

gs_sqa3d:
  scannet_base: ${data.scan_family_base}
  anno_dir: ${data.leo_base}/SQa3D_Leo
  max_obj_len: ${data.max_obj_len}
  num_points: ${data.num_points}
  pc_type: gt   # overrided from CLI

